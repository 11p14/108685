<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Verification</title>

<style>

body{
  font-family:sans-serif;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
}

.box{
  background:#111827;
  padding:30px;
  border-radius:16px;
  width:320px;
  text-align:center;
  border:1px solid rgba(255,255,255,.1);
}

.ok{
  color:#22c55e;
  font-size:26px;
  font-weight:bold;
}

.bad{
  color:#ef4444;
  font-size:26px;
  font-weight:bold;
}

.info{
  margin-top:20px;
  text-align:left;
  line-height:1.8;
}
.photo{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #22c55e;
  margin:0 auto 15px;
  display:block;
}

  .header{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
  padding-bottom:15px;
  border-bottom:1px solid rgba(255,255,255,.15);
}

.header-logo{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  flex-shrink:0;
}

.header-text{
  text-align:left;
}

.header-title{
  font-size:22px;
  font-weight:700;
  line-height:1.2;
}

.header-subtitle{
  font-size:12px;
  color:#94a3b8;
  margin-top:4px;
}
</style>
</head>
<body>

<div class="box">

<div class="header">

  <img src="Photos/LOGO2.png" class="header-logo">

  <div class="header-text">
    <div class="header-title">
      নদেরচাঁদ প্রেমচাঁদ দাস একাডেমী
    </div>

    <div class="header-subtitle">
      ID Verification System
    </div>
  </div>

</div>

<div id="photo"></div>

<div id="status"></div>

<div class="info" id="info"></div>

</div>

<script>

const teachers = [
{
    name:"মোঃ আছাদুজ্জামান",
    index:"১০০৭২০১",
    desg:"প্রধান শিক্ষক",
    photo:"Photos/Teachers-and-Staf-Photo/MD-Asaduzzan.jpg",
  },
  {
    name:"মোহাম্মদ হেমায়েত হোসেন",
    index:"৫৬৮৫৯৯৫৮",
    desg:"সহকারী প্রধান শিক্ষক",
        photo:"Photos/Teachers-and-Staf-Photo/Mohammad-Hamayet-Hossain.jpg",
  },
  {
    name:"রেবা পারভীন",
    index:"১০৫২০৪০",
    desg:"সহকারী শিক্ষক",
        photo:"Photos/Teachers-and-Staf-Photo/Reba-Parvin.jpg",
  },
  {
    name:"মোঃ মিলন মল্লিক",
    index:"১১৪৪২৭৬",
    desg:"সহকারী শিক্ষক",
        photo:"Photos/Teachers-and-Staf-Photo/MD-Milon_Mollik.jpg",
  },
  {
    name:"মোঃ নাইমুল হাসান",
    index:"৫৬৮৫৯৯৫৭",
    desg:"সহকারী শিক্ষক",
        photo:"Photos/Teachers-and-Staf-Photo/MD-Naimul-Hasan.jpg",
  },
  {
    name:"বিজিৎ কুমার সাহা",
    index:"১১১০৪৫৫",
    desg:"সহকারী শিক্ষক",
        photo:"Photos/Teachers-and-Staf-Photo/Bijit-Kumar-Saha.jpg",
  },

  {
    name:"এম.এ. মতিন",
    index:"১০৩১৭৫৭",
    desg:"সহকারী শিক্ষক",
        photo:"Photos/Teachers-and-Staf-Photo/MA-Motin.jpg",
  },
  {
    name:"মোঃ ইমামুল হুসাইন",
    index:"৫৬৮৫৯৯৫৯",
    desg:"অফিস সহায়ক",
        photo:"Photos/Teachers-and-Staf-Photo/MD-Emamul-Hossain.jpg",
  },
];

const url = new URLSearchParams(window.location.search);

const id = url.get('id');

const found = teachers.find(t => t.index === id);

if(found){

  document.getElementById('status').innerHTML =
    `<div class="ok">✅ VERIFIED</div>`;
  document.getElementById('photo').innerHTML =
  `<img src="${found.photo}" class="photo">`;

  document.getElementById('info').innerHTML = `
    <b>নাম:</b> ${found.name}<br>
    <b>পদবী:</b> ${found.desg}<br>
    <b>ইনডেক্স:</b> ${found.index}
  `;

}else{

  document.getElementById('status').innerHTML =
    `<div class="bad">❌ INVALID ID</div>`;

}

</script>

</body>
</html>
